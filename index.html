<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR Manager — Good Rich Power Plus</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Sarabun',Tahoma,sans-serif;background:#f0f2f5;color:#333;min-height:100vh}
button{cursor:pointer;border:none;font-family:inherit;font-size:14px}
input,select,textarea{font-family:inherit;font-size:14px;padding:10px 12px;border:1px solid #d0d0d0;border-radius:8px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:#1a3a6c;box-shadow:0 0 0 3px rgba(26,58,108,.15)}

:root{
  --navy:#1a3a6c;--blue:#2a5298;--blue-light:#e8f4fd;
  --red:#c62828;--red-light:#fde8e8;
  --green:#2e7d32;--green-light:#e8f5e9;
  --yellow:#f9a825;--yellow-light:#fffde7;
  --orange:#e65100;--purple:#6a1b9a;--purple-light:#f3e5f5;
  --gray1:#f8f9fa;--gray2:#e0e0e0;--gray3:#999
}

.screen{display:none}.screen.active{display:block}
.container{max-width:960px;margin:0 auto;padding:12px 16px 80px}

/* Login */
#loginScreen{background:linear-gradient(135deg,var(--navy),#0d2137);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:#fff;border-radius:16px;padding:40px 32px;width:100%;max-width:380px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.login-logo{font-size:20px;font-weight:700;color:var(--navy);margin-bottom:2px}
.login-sub{font-size:13px;color:var(--gray3);margin-bottom:4px}
.login-badge{display:inline-block;background:var(--navy);color:#fff;font-size:11px;padding:2px 10px;border-radius:10px;margin-bottom:24px}
.login-error{color:var(--red);font-size:13px;margin-top:8px;min-height:20px}
.login-loading{color:var(--blue);font-size:13px;margin-top:8px;display:none}

/* Topbar */
.topbar{background:linear-gradient(135deg,var(--navy),#0d2137);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.topbar-name{font-size:15px;font-weight:700}
.topbar-role{font-size:11px;opacity:.8}
.btn-logout{background:rgba(255,255,255,.2);color:#fff;padding:6px 14px;border-radius:6px;font-size:12px}

/* Bottom Nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--gray2);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.bottom-nav button{flex:1;padding:8px 0 6px;background:none;display:flex;flex-direction:column;align-items:center;font-size:9px;color:var(--gray3);gap:1px}
.bottom-nav button.active{color:var(--blue)}
.nav-icon{font-size:18px}

/* Cards */
.card{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);overflow:hidden;margin-bottom:12px}
.card-header{background:linear-gradient(135deg,var(--navy),var(--blue));padding:14px 18px;color:#fff}
.card-header h2{font-size:15px;font-weight:700}
.card-header p{font-size:11px;opacity:.8;margin-top:2px}
.card-body{padding:14px 18px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 18px;border-radius:8px;font-weight:600;font-size:13px;transition:all .15s;gap:5px}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--navy)}
.btn-success{background:var(--green);color:#fff}
.btn-danger{background:var(--red);color:#fff}
.btn-secondary{background:var(--gray1);color:#333;border:1px solid var(--gray2)}
.btn-warning{background:var(--yellow);color:#333}
.btn-block{width:100%;padding:13px}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}

/* Badges */
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge-pending{background:var(--yellow-light);color:var(--orange);border:1px solid var(--yellow)}
.badge-approved{background:var(--green-light);color:var(--green);border:1px solid var(--green)}
.badge-rejected{background:var(--red-light);color:var(--red);border:1px solid var(--red)}
.badge-cancelled{background:var(--gray1);color:var(--gray3);border:1px solid var(--gray2)}
.badge-draft{background:var(--yellow-light);color:var(--orange)}
.badge-confirmed{background:var(--green-light);color:var(--green)}

/* Stat cards */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:600px){.stat-grid{grid-template-columns:repeat(4,1fr)}}
.stat-card{background:var(--gray1);border-radius:10px;padding:14px;border:1px solid var(--gray2);text-align:center}
.stat-num{font-size:28px;font-weight:700;line-height:1}
.stat-label{font-size:11px;color:var(--gray3);margin-top:4px}
.stat-card.c-blue{border-color:var(--blue);background:var(--blue-light)}.stat-card.c-blue .stat-num{color:var(--blue)}
.stat-card.c-green{border-color:var(--green);background:var(--green-light)}.stat-card.c-green .stat-num{color:var(--green)}
.stat-card.c-red{border-color:var(--red);background:var(--red-light)}.stat-card.c-red .stat-num{color:var(--red)}
.stat-card.c-yellow{border-color:var(--yellow);background:var(--yellow-light)}.stat-card.c-yellow .stat-num{color:var(--orange)}

/* Tables */
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{background:var(--gray1);padding:8px 10px;text-align:left;font-weight:600;font-size:12px;color:var(--gray3);border-bottom:2px solid var(--gray2)}
.data-table td{padding:9px 10px;border-bottom:1px solid var(--gray2);vertical-align:middle}
.data-table tr:hover{background:#fafafa}
.data-table .actions{display:flex;gap:6px}

/* Employee card list */
.emp-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--gray2)}
.emp-row:last-child{border-bottom:none}
.emp-avatar{width:36px;height:36px;border-radius:50%;background:var(--blue-light);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.emp-info{flex:1;min-width:0}
.emp-name{font-weight:600;font-size:14px}
.emp-meta{font-size:11px;color:var(--gray3)}
.emp-status{flex-shrink:0}

/* Attendance grid (manager) */
.att-mgr-controls{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.att-mgr-controls select{flex:1;min-width:120px}
.att-mgr-table-wrap{overflow-x:auto}
.att-mgr-table{border-collapse:collapse;font-size:11px;min-width:600px}
.att-mgr-table th{background:var(--navy);color:#fff;padding:6px 8px;text-align:center;font-weight:600;position:sticky;top:0}
.att-mgr-table td{padding:4px 6px;border:1px solid var(--gray2);text-align:center;cursor:pointer;transition:background .1s}
.att-mgr-table td.emp-name-cell{text-align:left;background:var(--gray1);position:sticky;left:0;min-width:120px;font-weight:600;cursor:default}
.att-mgr-table td.s-work{background:#c8e6c9;color:var(--green)}
.att-mgr-table td.s-absent{background:#ffcdd2;color:var(--red)}
.att-mgr-table td.s-sick,.att-mgr-table td.s-leave,.att-mgr-table td.s-vacation,.att-mgr-table td.s-maternity{background:#bbdefb;color:var(--blue)}
.att-mgr-table td.s-late{background:#fff9c4;color:var(--orange)}
.att-mgr-table td.s-holiday{background:#f5f5f5;color:var(--gray3)}
.att-mgr-table td.s-empty{background:#fff;color:#ccc}
.att-status-picker{position:fixed;background:#fff;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.2);padding:10px;z-index:200;display:none;min-width:160px}
.att-status-picker button{display:block;width:100%;padding:8px 12px;text-align:left;background:none;border-radius:6px;font-size:13px;margin-bottom:2px}
.att-status-picker button:hover{background:var(--gray1)}

/* Leave approval */
.leave-approval-item{background:var(--gray1);border-radius:10px;padding:14px;border:1px solid var(--gray2);margin-bottom:10px}
.la-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.la-name{font-weight:700;font-size:15px}
.la-type{font-size:13px;color:var(--blue);font-weight:600}
.la-dates{font-size:12px;color:var(--gray3);margin-top:2px}
.la-reason{font-size:12px;color:#555;margin-bottom:10px}
.la-actions{display:flex;gap:8px;flex-wrap:wrap}
.la-note-input{margin-top:8px}

/* Payroll table */
.pay-mgr-table{border-collapse:collapse;font-size:12px;width:100%;min-width:700px}
.pay-mgr-table th{background:var(--navy);color:#fff;padding:8px;text-align:right}
.pay-mgr-table th:first-child,.pay-mgr-table th:nth-child(2){text-align:left}
.pay-mgr-table td{padding:6px 8px;border-bottom:1px solid var(--gray2);text-align:right;vertical-align:middle}
.pay-mgr-table td:first-child,.pay-mgr-table td:nth-child(2){text-align:left}
.pay-mgr-table input[type=number]{width:90px;padding:4px 6px;font-size:12px;text-align:right}
.pay-mgr-table tr:hover{background:#fafafa}
.pay-mgr-footer{display:flex;gap:10px;margin-top:12px;justify-content:flex-end}

/* Misc */
.divider{height:1px;background:var(--gray2);margin:10px 0}
.section-title{font-size:12px;font-weight:700;color:var(--gray3);margin-bottom:8px;letter-spacing:.5px;text-transform:uppercase}
.loading{text-align:center;padding:32px;color:var(--gray3);font-size:14px}
.empty{text-align:center;padding:32px;color:var(--gray3)}
.empty-icon{font-size:32px;margin-bottom:6px}
.filter-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filter-bar select,.filter-bar input{flex:1;min-width:120px}
.month-bar{margin-bottom:12px}
.month-bar select{font-weight:600;font-size:15px}
.msg-box{margin-top:10px;padding:10px;border-radius:8px;font-size:13px;text-align:center;display:none}
.msg-success{background:var(--green-light);color:var(--green)}
.msg-error{background:var(--red-light);color:var(--red)}
</style>
</head>
<body>

<!-- ═══ LOGIN ═══ -->
<div id="loginScreen" class="screen active">
  <div class="login-card">
    <div class="login-logo">Good Rich Power Plus</div>
    <div class="login-sub">ระบบจัดการ HR</div>
    <div class="login-badge">👑 HR / Manager Only</div>
    <input type="tel" id="loginInput" maxlength="13" placeholder="เลขบัตรประชาชน 13 หลัก" inputmode="numeric" autocomplete="off" style="margin-bottom:14px;letter-spacing:2px;text-align:center;font-size:16px">
    <button class="btn btn-primary btn-block" id="loginBtn">เข้าสู่ระบบ</button>
    <div class="login-error" id="loginError"></div>
    <div class="login-loading" id="loginLoading">กำลังตรวจสอบสิทธิ์...</div>
  </div>
</div>

<!-- ═══ APP ═══ -->
<div id="appScreen" class="screen">
  <div class="topbar">
    <div>
      <div class="topbar-name" id="topName"></div>
      <div class="topbar-role" id="topRole"></div>
    </div>
    <button class="btn-logout" id="logoutBtn">ออก</button>
  </div>

  <div class="container">
    <div id="tabDashboard" class="tab-content"><div class="loading">⏳ กำลังโหลด...</div></div>
    <div id="tabEmployees" class="tab-content" style="display:none"><div class="loading">⏳ กำลังโหลด...</div></div>
    <div id="tabAttendance" class="tab-content" style="display:none"><div class="loading">⏳ กำลังโหลด...</div></div>
    <div id="tabLeave" class="tab-content" style="display:none"><div class="loading">⏳ กำลังโหลด...</div></div>
    <div id="tabPayroll" class="tab-content" style="display:none"><div class="loading">⏳ กำลังโหลด...</div></div>
    <div id="tabRoles" class="tab-content" style="display:none"><div class="loading">⏳ กำลังโหลด...</div></div>
  </div>

  <div class="bottom-nav" id="bottomNav">
    <button data-tab="tabDashboard" class="active"><span class="nav-icon">📊</span>Dashboard</button>
    <button data-tab="tabEmployees"><span class="nav-icon">👥</span>พนักงาน</button>
    <button data-tab="tabAttendance"><span class="nav-icon">📅</span>เข้างาน</button>
    <button data-tab="tabLeave"><span class="nav-icon">✅</span>อนุมัติลา</button>
    <button data-tab="tabPayroll"><span class="nav-icon">💰</span>เงินเดือน</button>
    <button data-tab="tabRoles" id="navRoles" style="display:none"><span class="nav-icon">🔑</span>สิทธิ์</button>
  </div>
</div>

<!-- Attendance status picker popup -->
<div class="att-status-picker" id="statusPicker">
  <button onclick="pickStatus('ทำงาน')">✅ ทำงาน</button>
  <button onclick="pickStatus('มาสาย')">🟡 มาสาย</button>
  <button onclick="pickStatus('ขาด')">❌ ขาด</button>
  <button onclick="pickStatus('ลาป่วย')">🤒 ลาป่วย</button>
  <button onclick="pickStatus('ลากิจ')">📋 ลากิจ</button>
  <button onclick="pickStatus('ลาพักร้อน')">🏖️ ลาพักร้อน</button>
  <button onclick="pickStatus('วันหยุด')">🗓️ วันหยุด</button>
  <button onclick="pickStatus('')">— ล้างค่า</button>
  <div class="divider"></div>
  <button onclick="closeStatusPicker()" style="color:var(--gray3)">ยกเลิก</button>
</div>

<script>
// ============================================================
// CONFIG
// ============================================================
var API_URL = 'https://script.google.com/macros/s/AKfycbwAXmDQUtoEgBueR7hnEdVm3aIQYrHF98TOWid-vtEcA5nTFihebUEDdDV34tjO2QH_Og/exec';

// ============================================================
// STATE
// ============================================================
var _session = null;
var _credential = '';
var _months = [];
var _nowMonth = '';
var _employees = [];
var _deptFilter = 'all';
var _attMonth = '';
var _attDept = 'all';
var _attData = {}; // {empId: {date: status}}
var _attEdits = {}; // {empId_date: status}
var _pickerTarget = null; // {empId, date, tdEl}
var _payMonth = '';
var _payData = []; // payroll rows being edited
var _leaveLoaded = false;
var _empLoaded = false;

// ============================================================
// UTILS
// ============================================================
function $(id) { return document.getElementById(id); }
function fmt(n) {
  var num = parseFloat(n) || 0;
  return num.toLocaleString('th-TH', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtDate(d) {
  if (!d) return '';
  var s = String(d).substring(0, 10);
  var p = s.split('-');
  if (p.length === 3) return p[2] + '/' + p[1] + '/' + (parseInt(p[0]) + 543);
  return s;
}
function statusBadge(s) {
  var cls = {รออนุมัติ:'badge-pending',อนุมัติ:'badge-approved',ไม่อนุมัติ:'badge-rejected',ยกเลิก:'badge-cancelled'}[s] || 'badge-pending';
  return '<span class="badge ' + cls + '">' + s + '</span>';
}
function _nowMonthStr() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function _monthLabel(m) {
  if (!m) return '';
  var p = m.split('-');
  var names = ['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  return names[parseInt(p[1])] + ' ' + (parseInt(p[0]) + 543);
}
function _buildMonthSelect(id, value) {
  var html = '<select id="' + id + '">';
  _months.forEach(function(m) {
    html += '<option value="' + m + '"' + (m === value ? ' selected' : '') + '>' + _monthLabel(m) + '</option>';
  });
  return html + '</select>';
}
function _depts() {
  var seen = {};
  _employees.forEach(function(e) { if (e.dept) seen[e.dept] = true; });
  return Object.keys(seen).sort();
}
function _buildDeptSelect(id, value) {
  var html = '<select id="' + id + '"><option value="all">ทุกแผนก</option>';
  _depts().forEach(function(d) { html += '<option value="' + d + '"' + (d === value ? ' selected' : '') + '>' + d + '</option>'; });
  return html + '</select>';
}

async function apiGet(action, params) {
  var url = API_URL + '?action=' + encodeURIComponent(action);
  params = params || {};
  params.empId = _session ? _session.empId : '';
  params.credential = _credential;
  Object.keys(params).forEach(function(k) {
    url += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(params[k] || '');
  });
  var res = await fetch(url);
  var text = await res.text();
  try { return JSON.parse(text); }
  catch(e) { return {success:false, error:'Response error: ' + text.substring(0, 100)}; }
}

async function apiPost(payload) {
  payload.empId = _session.empId;
  payload.credential = _credential;
  var res = await fetch(API_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(payload)
  });
  var text = await res.text();
  try { return JSON.parse(text); }
  catch(e) { return {success:false, error:'Response error'}; }
}

// ============================================================
// LOGIN
// ============================================================
$('loginBtn').addEventListener('click', doLogin);
$('loginInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
  var cred = $('loginInput').value.replace(/\D/g, '');
  $('loginError').textContent = '';
  if (cred.length !== 13) { $('loginError').textContent = 'กรุณากรอกเลขบัตรประชาชน 13 หลัก'; return; }
  $('loginLoading').style.display = 'block';
  $('loginBtn').disabled = true;
  try {
    var result = await apiGet('login', {credential: cred});
    if (!result.success) { $('loginError').textContent = result.error; return; }
    if (!['hr','manager','admin'].includes(result.data.role)) {
      $('loginError').textContent = '⛔ ไม่มีสิทธิ์ใช้งานระบบ HR Manager';
      return;
    }
    _session = result.data;
    _credential = cred;
    $('loginScreen').classList.remove('active');
    $('appScreen').classList.add('active');
    $('topName').textContent = _session.name;
    var roleLabel = {admin:'👑 Admin', manager:'🔷 Manager', hr:'🏢 HR'}[_session.role] || _session.role;
    $('topRole').textContent = roleLabel + ' — ' + _session.dept;
    // Show role management tab for admin only
    if (_session.role === 'admin') {
      $('navRoles').style.display = '';
    }
    await _loadMonths();
    await _loadEmployees();
    loadDashboard();
  } catch(err) {
    $('loginError').textContent = 'เกิดข้อผิดพลาด: ' + err.message;
  } finally {
    $('loginLoading').style.display = 'none';
    $('loginBtn').disabled = false;
  }
}

$('logoutBtn').addEventListener('click', function() {
  _session = null; _credential = ''; _employees = []; _leaveLoaded = false; _empLoaded = false;
  $('appScreen').classList.remove('active');
  $('loginScreen').classList.add('active');
  $('loginInput').value = ''; $('loginError').textContent = '';
});

// ============================================================
// NAV
// ============================================================
$('bottomNav').addEventListener('click', function(e) {
  var btn = e.target.closest('button[data-tab]');
  if (!btn) return;
  var tab = btn.dataset.tab;
  document.querySelectorAll('.bottom-nav button').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  document.querySelectorAll('.tab-content').forEach(function(t) { t.style.display = 'none'; });
  $(tab).style.display = '';
  if (tab === 'tabDashboard') loadDashboard();
  if (tab === 'tabEmployees') loadEmployees();
  if (tab === 'tabAttendance') loadAttendanceMgr();
  if (tab === 'tabLeave') loadLeaveApproval();
  if (tab === 'tabPayroll') loadPayrollMgr();
  if (tab === 'tabRoles') loadRoleManager();
});

// Close picker on outside click
document.addEventListener('click', function(e) {
  if (!e.target.closest('#statusPicker') && !e.target.closest('.att-mgr-table td:not(.emp-name-cell)')) {
    closeStatusPicker();
  }
});

// ============================================================
// INIT DATA
// ============================================================
async function _loadMonths() {
  var r = await apiGet('getMonths', {});
  if (r.success) {
    _months = r.data;
    _attMonth = _months[0] || _nowMonthStr();
    _payMonth = _months[0] || _nowMonthStr();
    _nowMonth = _nowMonthStr();
    if (_months.indexOf(_nowMonth) < 0) _months.unshift(_nowMonth);
  }
}

async function _loadEmployees() {
  var r = await apiGet('getEmployeeList', {});
  if (r.success) { _employees = r.data; _empLoaded = true; }
}

// ============================================================
// TAB: DASHBOARD
// ============================================================
async function loadDashboard() {
  $('tabDashboard').innerHTML = '<div class="loading">⏳ กำลังโหลด...</div>';
  var pendingR = await apiGet('getPendingLeaves', {});
  var pending = pendingR.success ? pendingR.data : [];

  var active = _employees.filter(function(e) { return e.status !== 'ลาออก' && e.status !== 'พ้นสภาพ'; });
  var probation = active.filter(function(e) { return e.status === 'พนักงานทดลองงาน'; });

  var html = '<div class="card"><div class="card-header"><h2>📊 Dashboard</h2><p>' + _monthLabel(_nowMonth) + '</p></div>';
  html += '<div class="card-body">';
  html += '<div class="stat-grid">';

function filterEmployees() {
  var search = ($('empSearch') ? $('empSearch').value : '').toLowerCase();
  var dept = _deptFilter;
  var filtered = _employees.filter(function(e) {
    var nameMatch = !search || e.name.toLowerCase().indexOf(search) >= 0 || (e.nickname || '').toLowerCase().indexOf(search) >= 0;
    var deptMatch = dept === 'all' || e.dept === dept;
    return nameMatch && deptMatch;
  });
  if ($('empList')) $('empList').innerHTML = _renderEmpList(filtered);
}

function _renderEmpList(list) {
  if (list.length === 0) return '<div class="empty"><div class="empty-icon">🔍</div>ไม่พบพนักงาน</div>';
  var statusColors = {'พนักงานประจำ':'var(--green)','พนักงานทดลองงาน':'var(--orange)','ลาออก':'var(--red)','พ้นสภาพ':'var(--gray3)','เกษียณอายุ':'var(--purple)'};
  return list.map(function(e) {
    var initials = (e.name || '').replace(/^(นาย|นาง|นางสาว|น\.ส\.|ดร\.|)/,'').trim().charAt(0);
    var color = statusColors[e.status] || 'var(--blue)';
    return '<div class="emp-row">' +
      '<div class="emp-avatar">' + initials + '</div>' +
      '<div class="emp-info">' +
        '<div class="emp-name">' + e.name + (e.nickname ? ' <span style="color:var(--gray3);font-weight:400;font-size:12px">(' + e.nickname + ')</span>' : '') + '</div>' +
        '<div class="emp-meta">' + e.empId + ' · ' + (e.dept || 'ไม่ระบุแผนก') + ' · ' + (e.position || '') + '</div>' +
        '<div class="emp-meta">เงินเดือน ฿' + fmt(e.salary) + '</div>' +
      '</div>' +
      '<div class="emp-status"><span style="font-size:11px;color:' + color + ';font-weight:600">' + (e.status || '') + '</span></div>' +
    '</div>';
  }).join('');
}

async function loadAttendanceMgr() {
  $('tabAttendance').innerHTML = '<div class="loading">⏳ กำลังโหลดตารางเข้างาน...</div>';

  _renderAttendanceMgr(r.data);
}

function _renderAttendanceMgr(data) {
  var month = _attMonth;
  var parts = month.split('-');
  var year = parseInt(parts[0]);
  var mon = parseInt(parts[1]);
  var daysInMonth = new Date(year, mon, 0).getDate();

  // Build att map from data
  _attData = {};
  data.forEach(function(emp) {
    _attData[emp.empId] = {};
    (emp.attendance || []).forEach(function(a) {
      var d = parseInt(String(a.date).split('-')[2]);
      _attData[emp.empId][d] = a.status;
    });
  });
  _attEdits = {};

  var weekDays = ['อา','จ','อ','พ','พฤ','ศ','ส'];
  var statusClass = {ทำงาน:'s-work',ขาด:'s-absent',ลาป่วย:'s-sick',ลากิจ:'s-leave',ลาพักร้อน:'s-vacation',วันหยุด:'s-holiday',มาสาย:'s-late',ลาคลอด:'s-maternity'};

  var html = '<div class="card"><div class="card-header"><h2>📅 บันทึกการเข้างาน</h2></div>';
  html += '<div class="card-body">';
  html += '<div class="att-mgr-controls">';
  html += _buildMonthSelect('attMgrMon', month);
  html += _buildDeptSelect('attMgrDept', _attDept);
  html += '</div>';

  if (data.length === 0) {
    html += '<div class="empty"><div class="empty-icon">👤</div>ไม่พบพนักงาน</div>';
  } else {
    html += '<div class="att-mgr-table-wrap"><table class="att-mgr-table">';
    // Header row: employee name + dates
    html += '<tr><th style="text-align:left;min-width:120px">พนักงาน</th>';
    for (var d = 1; d <= daysInMonth; d++) {
      var dow = new Date(year, mon - 1, d).getDay();
      var isWeekend = dow === 0 || dow === 6;
      html += '<th style="min-width:28px;' + (isWeekend ? 'opacity:.5' : '') + '">' + d + '<br><span style="font-size:9px">' + weekDays[dow] + '</span></th>';
    }
    html += '</tr>';

    data.forEach(function(emp) {
      html += '<tr><td class="emp-name-cell">' + (emp.name || emp.empId) + '<br><span style="font-size:10px;color:var(--gray3)">' + emp.empId + '</span></td>';
      for (var d = 1; d <= daysInMonth; d++) {
        var dow = new Date(year, mon - 1, d).getDay();
        var isWeekend = dow === 0 || dow === 6;
        var st = (_attData[emp.empId] || {})[d] || (isWeekend ? 'วันหยุด' : '');
        var cls = statusClass[st] || (st ? '' : 's-empty');
        var shortLabels = {ทำงาน:'✓',ขาด:'✗',ลาป่วย:'ป',ลากิจ:'ก',ลาพักร้อน:'พ',วันหยุด:'•',มาสาย:'ส',ลาคลอด:'ค','':''};
        var label = shortLabels[st] !== undefined ? shortLabels[st] : st.charAt(0);
        html += '<td class="' + cls + '" data-emp="' + emp.empId + '" data-day="' + d + '" onclick="openStatusPicker(this,\'' + emp.empId + '\',' + d + ')">' + label + '</td>';
      }
      html += '</tr>';
    });
    html += '</table></div>';

    html += '<div style="display:flex;gap:10px;margin-top:14px;justify-content:flex-end">';
    html += '<button class="btn btn-primary" onclick="saveAttendance()">💾 บันทึกการแก้ไข</button>';
    html += '</div>';
    html += '<div id="attMgrMsg" class="msg-box"></div>';
  }

  html += '</div></div>';
  $('tabAttendance').innerHTML = html;

  $('attMgrMon').addEventListener('change', function() { _attMonth = this.value; loadAttendanceMgr(); });
  $('attMgrDept').addEventListener('change', function() { _attDept = this.value; loadAttendanceMgr(); });
}

function openStatusPicker(td, empId, day) {
  _pickerTarget = {empId: empId, day: day, td: td};
  var rect = td.getBoundingClientRect();
  var picker = $('statusPicker');
  picker.style.display = 'block';
  var top = rect.bottom + window.scrollY + 4;
  var left = rect.left + window.scrollX;
  if (left + 180 > window.innerWidth) left = window.innerWidth - 184;
  picker.style.top = top + 'px';
  picker.style.left = left + 'px';
}

function closeStatusPicker() { $('statusPicker').style.display = 'none'; _pickerTarget = null; }

function pickStatus(status) {
  if (!_pickerTarget) return;
  var td = _pickerTarget.td;
  var empId = _pickerTarget.empId;
  var day = _pickerTarget.day;
  var statusClass = {ทำงาน:'s-work',ขาด:'s-absent',ลาป่วย:'s-sick',ลากิจ:'s-leave',ลาพักร้อน:'s-vacation',วันหยุด:'s-holiday',มาสาย:'s-late',ลาคลอด:'s-maternity'};
  var shortLabels = {ทำงาน:'✓',ขาด:'✗',ลาป่วย:'ป',ลากิจ:'ก',ลาพักร้อน:'พ',วันหยุด:'•',มาสาย:'ส',ลาคลอด:'ค','':''};
  // Remove existing status classes
  Object.values(statusClass).concat(['s-empty']).forEach(function(c) { td.classList.remove(c); });
  td.classList.add(statusClass[status] || 's-empty');
  td.textContent = shortLabels[status] !== undefined ? shortLabels[status] : status;
  _attEdits[empId + '_' + day] = status;
  if (!_attData[empId]) _attData[empId] = {};
  _attData[empId][day] = status;
  closeStatusPicker();
}

async function saveAttendance() {
  var keys = Object.keys(_attEdits);
  if (keys.length === 0) { alert('ยังไม่มีการแก้ไข'); return; }
  var msg = $('attMgrMsg');
  msg.className = 'msg-box'; msg.textContent = 'กำลังบันทึก...'; msg.style.display = 'block';

  var month = _attMonth;
  var parts = month.split('-');
  var year = parseInt(parts[0]);
  var mon = parseInt(parts[1]);

  var promises = keys.map(function(k) {
    var split = k.split('_');
    var empId = split[0];
    var day = parseInt(split[1]);
    var dateStr = year + '-' + String(mon).padStart(2,'0') + '-' + String(day).padStart(2,'0');
    return apiPost({action:'markAttendance', targetEmpId:empId, date:dateStr, status:_attEdits[k]});
  });

  var results = await Promise.all(promises);
  var errors = results.filter(function(r) { return !r.success; });
  if (errors.length === 0) {
    _attEdits = {};
    msg.className = 'msg-box msg-success'; msg.textContent = '✅ บันทึก ' + keys.length + ' รายการเรียบร้อย';
  } else {
    msg.className = 'msg-box msg-error'; msg.textContent = '❌ บันทึกไม่สำเร็จ ' + errors.length + ' รายการ';
  }
  setTimeout(function() { msg.style.display = 'none'; }, 3000);
}

async function loadPayrollMgr() {
  $('tabPayroll').innerHTML = '<div class="loading">⏳ กำลังโหลด...</div>';
  // Load existing payroll for month
  var existR = await apiGet('getPayrollSummary', {month: _payMonth});
  var existing = {};
  if (existR.success) existR.data.forEach(function(r) { existing[r.empId] = r; });

  // Build rows from active employees + existing data
  var active = _employees.filter(function(e) { return e.status !== 'ลาออก' && e.status !== 'พ้นสภาพ'; });
  _payData = active.map(function(e) {
    var ex = existing[e.empId] || {};
    return {
      empId: e.empId, name: e.name, dept: e.dept, position: e.position,
      month: _payMonth,
      salary: ex.salary !== undefined ? ex.salary : e.salary,
      allowances: ex.allowances !== undefined ? ex.allowances : 0,
      otPay: ex.otPay || 0,
      otherIncome: ex.otherIncome || 0,
      otherDeduct: ex.otherDeduct || 0,
      note: ex.note || '',
      status: ex.status || 'draft'
    };
  });

  _renderPayrollMgr();
}

function _renderPayrollMgr() {
  var html = '<div class="card"><div class="card-header"><h2>💰 จัดการเงินเดือน</h2></div>';
  html += '<div class="card-body">';
  html += '<div class="month-bar">' + _buildMonthSelect('payMgrMon', _payMonth) + '</div>';
  html += '<div style="overflow-x:auto"><table class="pay-mgr-table">';
  html += '<tr><th>EmpID</th><th>ชื่อ</th><th>เงินเดือน</th><th>เบี้ยเลี้ยง</th><th>OT ฿</th><th>รายรับอื่น</th><th>หักอื่น</th><th>สุทธิ</th></tr>';

  _payData.forEach(function(row, i) {
    var totalIncome = (Number(row.salary)||0) + (Number(row.allowances)||0) + (Number(row.otPay)||0) + (Number(row.otherIncome)||0);
    var sso = Math.min(Math.round(totalIncome * 0.05), 750);
    var net = totalIncome - sso - (Number(row.otherDeduct)||0);
    html += '<tr>';
    html += '<td style="font-size:11px;color:var(--gray3)">' + row.empId + '</td>';
    html += '<td style="font-weight:600;min-width:130px">' + row.name + '</td>';
    html += '<td><input type="number" data-idx="' + i + '" data-field="salary" value="' + (row.salary||0) + '" oninput="updatePayRow(this)"></td>';
    html += '<td><input type="number" data-idx="' + i + '" data-field="allowances" value="' + (row.allowances||0) + '" oninput="updatePayRow(this)"></td>';
    html += '<td><input type="number" data-idx="' + i + '" data-field="otPay" value="' + (row.otPay||0) + '" oninput="updatePayRow(this)"></td>';
    html += '<td><input type="number" data-idx="' + i + '" data-field="otherIncome" value="' + (row.otherIncome||0) + '" oninput="updatePayRow(this)"></td>';
    html += '<td><input type="number" data-idx="' + i + '" data-field="otherDeduct" value="' + (row.otherDeduct||0) + '" oninput="updatePayRow(this)"></td>';
    html += '<td id="net_' + i + '" style="font-weight:700;color:var(--navy)">฿' + fmt(net) + '</td>';
    html += '</tr>';
  });
  html += '</table></div>';

  html += '<div class="pay-mgr-footer">';
  html += '<button class="btn btn-secondary" onclick="savePayroll(\'draft\')">💾 Save Draft</button>';
  html += '<button class="btn btn-success" onclick="savePayroll(\'confirmed\')" style="margin-left:8px">✅ Confirm เงินเดือน</button>';
  html += '</div>';
  html += '<div id="payMgrMsg" class="msg-box"></div>';
  html += '</div></div>';
  $('tabPayroll').innerHTML = html;

  $('payMgrMon').addEventListener('change', function() {
    _payMonth = this.value;
    loadPayrollMgr();
  });
}

function updatePayRow(input) {
  var idx = parseInt(input.dataset.idx);
  var field = input.dataset.field;
  _payData[idx][field] = Number(input.value) || 0;
  // Recalculate net
  var row = _payData[idx];
  var totalIncome = (row.salary||0) + (row.allowances||0) + (row.otPay||0) + (row.otherIncome||0);
  var sso = Math.min(Math.round(totalIncome * 0.05), 750);
  var net = totalIncome - sso - (row.otherDeduct||0);
  var netEl = $('net_' + idx);
  if (netEl) netEl.textContent = '฿' + fmt(net);
}

  html += '<div id="roleEmpList">' + _renderRoleEmpList(list) + '</div>';
  html += '<div id="roleMsg" class="msg-box" style="margin-top:10px"></div>';
  html += '</div></div>';

  $('tabRoles').innerHTML = html;
  $('roleDeptFilter').addEventListener('change', filterRoleList);
}

function _renderRoleEmpList(list) {
  var search = $('roleSearch') ? $('roleSearch').value.toLowerCase() : '';
  var dept = $('roleDeptFilter') ? $('roleDeptFilter').value : 'all';
  var filtered = list.filter(function(e) {
    if (e.role === 'admin' || e.role === 'hr') return false; // already shown above or skip admin
    if (e.status === 'ลาออก' || e.status === 'พ้นสภาพ') return false;
    var nameMatch = !search || e.name.toLowerCase().indexOf(search) >= 0;
    var deptMatch = dept === 'all' || e.dept === dept;
    return nameMatch && deptMatch;
  });
  if (filtered.length === 0) return '<div class="empty" style="padding:16px"><div class="empty-icon">🔍</div>ไม่พบพนักงาน</div>';
  return filtered.map(function(e) {
    return '<div class="emp-row">' +
      '<div class="emp-avatar">' + (e.name||'').replace(/^(นาย|นาง|นางสาว)/,'').trim().charAt(0) + '</div>' +
      '<div class="emp-info"><div class="emp-name">' + e.name + (e.nickname ? ' (' + e.nickname + ')' : '') + '</div>' +
      '<div class="emp-meta">' + e.empId + ' · ' + (e.dept||'ไม่ระบุ') + '</div></div>' +
      '<div class="emp-status"><button class="btn btn-primary btn-sm" onclick="changeRole(\'' + e.empId + '\',\'hr\',this)">ให้สิทธิ์ HR</button></div>' +
    '</div>';
  }).join('');
}

function filterRoleList() {
  if ($('roleEmpList')) {
    var r = apiGet('getEmployeeRoles', {});
    r.then(function(res) {
      if (res.success && $('roleEmpList')) $('roleEmpList').innerHTML = _renderRoleEmpList(res.data);
    });
  }
}

async function changeRole(targetEmpId, newRole, btn) {
  btn.disabled = true;
  var msg = $('roleMsg');
  var r = await apiPost({action:'updateRole', targetEmpId:targetEmpId, newRole:newRole});
  if (r.success) {
    msg.className = 'msg-box msg-success';
    msg.textContent = (newRole === 'hr' ? '✅ ให้สิทธิ์ HR' : '🔄 ถอนสิทธิ์ HR') + ' เรียบร้อยแล้ว';
    msg.style.display = 'block';
    setTimeout(function() { msg.style.display = 'none'; loadRoleManager(); }, 1500);
  } else {
    msg.className = 'msg-box msg-error';
    msg.textContent = '❌ ' + r.error;
    msg.style.display = 'block';
    btn.disabled = false;
  }
}

async function savePayroll(status) {
  var msg = $('payMgrMsg');
  msg.className = 'msg-box'; msg.textContent = 'กำลังบันทึก...'; msg.style.display = 'block';
  var rows = _payData.map(function(r) { return Object.assign({}, r, {month: _payMonth}); });
  var res = await apiPost({action:'savePayroll', rows:rows, status:status});
  if (res.success) {
    msg.className = 'msg-box msg-success';
    msg.textContent = (status === 'confirmed' ? '✅ Confirm' : '💾 Save') + ' เงินเดือน ' + _monthLabel(_payMonth) + ' เรียบร้อย (' + res.saved + ' คน)';
  } else {
    msg.className = 'msg-box msg-error';
    msg.textContent = '❌ ' + res.error;
  }
  setTimeout(function() { msg.style.display = 'none'; }, 4000);
}
</script>
</body>
</html>
