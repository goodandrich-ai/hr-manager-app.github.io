<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR Manager — Good Rich Power Plus</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Sarabun',Tahoma,sans-serif;background:#f0f2f5;color:#333;min-height:100vh}
button{cursor:pointer;border:none;font-family:inherit;font-size:14px}
input,select,textarea{font-family:inherit;font-size:14px;padding:10px 12px;border:1px solid #d0d0d0;border-radius:8px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:#1a3a6c;box-shadow:0 0 0 3px rgba(26,58,108,.15)}
:root{
  --navy:#1a3a6c;--blue:#2a5298;--blue-light:#e8f4fd;
  --red:#c62828;--red-light:#fde8e8;
  --green:#2e7d32;--green-light:#e8f5e9;
  --yellow:#f9a825;--yellow-light:#fffde7;
  --orange:#e65100;--purple:#6a1b9a;--purple-light:#f3e5f5;
  --gray1:#f8f9fa;--gray2:#e0e0e0;--gray3:#999
}
.screen{display:none}.screen.active{display:block}
.container{max-width:960px;margin:0 auto;padding:12px 16px 80px}
.topbar{background:linear-gradient(135deg,var(--navy),#0d2137);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.topbar-name{font-size:15px;font-weight:700}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--gray2);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.bottom-nav button{flex:1;padding:8px 0 6px;background:none;display:flex;flex-direction:column;align-items:center;font-size:9px;color:var(--gray3);gap:1px}
.bottom-nav button.active{color:var(--blue)}
.nav-icon{font-size:18px}
.card{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);overflow:hidden;margin-bottom:12px}
.card-header{background:linear-gradient(135deg,var(--navy),var(--blue));padding:14px 18px;color:#fff}
.card-header h2{font-size:15px;font-weight:700}
.card-header p{font-size:11px;opacity:.8;margin-top:2px}
.card-body{padding:14px 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 18px;border-radius:8px;font-weight:600;font-size:13px;transition:all .15s;gap:5px}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--navy)}
.btn-success{background:var(--green);color:#fff}
.btn-danger{background:var(--red);color:#fff}
.btn-secondary{background:var(--gray1);color:#333;border:1px solid var(--gray2)}
.btn-email{background:#dd4155;color:#fff}
.btn-csv{background:var(--green);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge-draft{background:var(--yellow-light);color:var(--orange)}
.badge-confirmed{background:var(--green-light);color:var(--green);border:1px solid var(--green)}
.badge-probation{background:var(--purple-light);color:var(--purple);border:1px solid var(--purple)}
.badge-overdue{background:var(--red-light);color:var(--red);border:1px solid var(--red)}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:600px){.stat-grid{grid-template-columns:repeat(4,1fr)}}
.stat-card{background:var(--gray1);border-radius:10px;padding:14px;border:1px solid var(--gray2);text-align:center}
.stat-num{font-size:28px;font-weight:700;line-height:1}
.stat-label{font-size:11px;color:var(--gray3);margin-top:4px}
.stat-card.c-blue{border-color:var(--blue);background:var(--blue-light)}.stat-card.c-blue .stat-num{color:var(--blue)}
.stat-card.c-green{border-color:var(--green);background:var(--green-light)}.stat-card.c-green .stat-num{color:var(--green)}
.stat-card.c-red{border-color:var(--red);background:var(--red-light)}.stat-card.c-red .stat-num{color:var(--red)}
.stat-card.c-yellow{border-color:var(--yellow);background:var(--yellow-light)}.stat-card.c-yellow .stat-num{color:var(--orange)}
.emp-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--gray2)}
.emp-row:last-child{border-bottom:none}
.emp-avatar{width:36px;height:36px;border-radius:50%;background:var(--blue-light);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.emp-info{flex:1;min-width:0}
.emp-name{font-weight:600;font-size:14px}
.emp-meta{font-size:11px;color:var(--gray3)}
.emp-status{flex-shrink:0}
/* Probation timeline */
.prob-bar-wrap{height:6px;background:var(--gray2);border-radius:3px;margin-top:4px;position:relative}
.prob-bar{height:100%;border-radius:3px;background:var(--purple)}
.prob-bar.overdue{background:var(--red)}
/* Payroll table */
.pay-mgr-table{border-collapse:collapse;font-size:12px;width:100%;min-width:1000px}
.pay-mgr-table th{background:var(--navy);color:#fff;padding:7px 6px;text-align:right;white-space:nowrap}
.pay-mgr-table th:first-child,.pay-mgr-table th:nth-child(2){text-align:left}
.pay-mgr-table td{padding:5px 6px;border-bottom:1px solid var(--gray2);text-align:right;vertical-align:middle}
.pay-mgr-table td:first-child,.pay-mgr-table td:nth-child(2){text-align:left}
.pay-mgr-table input[type=number]{width:80px;padding:3px 5px;font-size:12px;text-align:right}
.pay-mgr-table tr:hover td{background:#fafafa}
.pay-mgr-footer{display:flex;gap:8px;margin-top:12px;justify-content:flex-end;flex-wrap:wrap}
/* YTD table */
.ytd-table{width:100%;border-collapse:collapse;font-size:12px}
.ytd-table th{background:var(--gray1);padding:7px 10px;text-align:right;font-size:11px;color:var(--gray3);border-bottom:2px solid var(--gray2)}
.ytd-table th:first-child,.ytd-table th:nth-child(2){text-align:left}
.ytd-table td{padding:6px 10px;border-bottom:1px solid var(--gray2);text-align:right}
.ytd-table td:first-child,.ytd-table td:nth-child(2){text-align:left}
.ytd-table tr:hover td{background:#fafafa}
.ytd-total td{font-weight:700;background:var(--blue-light)!important;color:var(--navy)}
/* Progress */
.progress-wrap{height:6px;background:var(--gray2);border-radius:3px;overflow:hidden;margin:6px 0}
.progress-bar{height:100%;background:var(--blue);border-radius:3px;transition:width .3s}
/* Misc */
.divider{height:1px;background:var(--gray2);margin:10px 0}
.section-title{font-size:12px;font-weight:700;color:var(--gray3);margin-bottom:8px;letter-spacing:.5px;text-transform:uppercase}
.loading{text-align:center;padding:32px;color:var(--gray3);font-size:14px}
.empty{text-align:center;padding:32px;color:var(--gray3)}
.filter-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filter-bar select,.filter-bar input{flex:1;min-width:120px}
.msg-box{margin-top:10px;padding:10px;border-radius:8px;font-size:13px;text-align:center;display:none}
.msg-success{background:var(--green-light);color:var(--green)}
.msg-error{background:var(--red-light);color:var(--red)}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:none}
.modal-overlay.open{display:flex;align-items:flex-end;justify-content:center}
.modal-sheet{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:20px 16px}
.modal-title{font-size:16px;font-weight:700;margin-bottom:16px;color:var(--navy);display:flex;justify-content:space-between;align-items:center}
.form-row{margin-bottom:10px}
.form-row label{display:block;font-size:11px;font-weight:600;color:var(--gray3);margin-bottom:3px;text-transform:uppercase;letter-spacing:.3px}
.form-group{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-footer{display:flex;gap:10px;margin-top:16px;padding-top:12px;border-top:1px solid var(--gray2);justify-content:flex-end}
/* Pill tab inside payroll */
.pill-tabs{display:flex;gap:6px;margin-bottom:14px}
.pill-tab{padding:6px 16px;border-radius:20px;font-size:12px;font-weight:600;background:var(--gray1);color:var(--gray3);border:1px solid var(--gray2)}
.pill-tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
/* Slip modal */
.slip-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:400;display:none;align-items:center;justify-content:center;padding:12px}
.slip-modal-overlay.open{display:flex}
.slip-modal-box{background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.25)}
.slip-modal-actions{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--gray2);justify-content:flex-end;flex-wrap:wrap;background:#fff;border-radius:0 0 16px 16px;position:sticky;bottom:0}
.btn-slip{background:#dd4155;color:#fff}
/* Professional payslip */
.payslip{font-family:'Sarabun',Tahoma,sans-serif;color:#333}
.ps-header{background:#072b4e;color:#fff;padding:20px 24px}
.ps-header h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.3px}
.ps-header p{margin:4px 0 0;font-size:11px;opacity:.7}
.ps-month{background:#1a3a6c;color:#fff;padding:10px 24px;font-size:13px;font-weight:600;letter-spacing:.5px}
.ps-emp{padding:14px 24px;border-bottom:1px solid #e8edf5;background:#f8fafd}
.ps-emp-name{font-size:15px;font-weight:700;color:#072b4e;margin-bottom:2px}
.ps-emp-meta{font-size:11px;color:#888}
.ps-sec{padding:5px 24px;font-size:10px;font-weight:700;color:#072b4e;background:#e8edf5;letter-spacing:1px;text-transform:uppercase;border-top:2px solid #ccd8ea}
.ps-table{width:100%;border-collapse:collapse}
.ps-table td{padding:7px 24px;font-size:13px;border-bottom:1px solid #f0f0f0}
.ps-table td:last-child{text-align:right;font-weight:600}
.ps-table tr:nth-child(even) td{background:#fafbfd}
.ps-total td{background:#072b4e!important;color:#fff;font-weight:700;font-size:13px}
.ps-net{background:linear-gradient(135deg,#072b4e,#1a3a6c);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center}
.ps-net-label{font-size:13px;opacity:.85}
.ps-net-amount{font-size:22px;font-weight:700}
.ps-bank{padding:12px 24px;background:#f8fafd;border-top:1px solid #e8edf5;font-size:11px;color:#888}
/* Print isolation */
@media print{
  body>*{visibility:hidden!important}
  #printSlipArea,#printSlipArea *{visibility:visible!important}
  #printSlipArea{position:fixed;left:0;top:0;width:100%;z-index:9999;background:#fff}
  .slip-modal-overlay{display:none!important}
}
</style>
</head>
<body>

<div id="appScreen" class="screen active">
  <div class="topbar">
    <div>
      <div class="topbar-name">Good Rich Power Plus</div>
      <div style="font-size:11px;opacity:.7">&#128081; ระบบ HR Manager</div>
    </div>
    <div style="font-size:11px;opacity:.7">&#128274; grp-hrm-2026</div>
  </div>
  <div class="container">
    <div id="tabDashboard" class="tab-content"><div class="loading">&#9203;</div></div>
    <div id="tabEmployees" class="tab-content" style="display:none"><div class="loading">&#9203;</div></div>
    <div id="tabPayroll"   class="tab-content" style="display:none"><div class="loading">&#9203;</div></div>

  <div class="bottom-nav" id="bottomNav">

    <button data-tab="tabEmployees"><span class="nav-icon">&#128101;</span>พนักงาน</button>
    <button data-tab="tabPayroll"><span class="nav-icon">&#128176;</span>เงินเดือน</button>

</div>

<!-- Slip Modal -->
<div class="slip-modal-overlay" id="slipModal" onclick="if(event.target===this)closeSlipModal()">
  <div class="slip-modal-box">
    <div id="slipContent"></div>
    <div class="slip-modal-actions">
      <button class="btn btn-secondary btn-sm" onclick="closeSlipModal()">✕ ปิด</button>
      <button class="btn btn-slip btn-sm" id="slipEmailBtn" onclick="emailSlipFromModal()">📧 ส่งอีเมล</button>

    </div>

</div>
<div id="printSlipArea" style="display:none"></div>

<!-- Edit Leave Quota Modal -->
<div class="modal-overlay" id="editQuotaModal">
  <div class="modal-sheet">
    <div class="modal-title">
      <span>&#9999; แก้ไขสิทธิ์วันลา</span>
      <button onclick="closeEditQuota()" style="background:none;font-size:22px;padding:0;color:var(--gray3)">&#215;</button>
    </div>
    <div id="editQuotaForm"></div>
    <div id="editQuotaMsg" class="msg-box"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeEditQuota()">ยกเลิก</button>
      <button class="btn btn-primary" onclick="saveEditQuota()">&#128190; บันทึก</button>
    </div>
  </div>
</div>

<!-- Edit Employee Modal -->
<div class="modal-overlay" id="editEmpModal">
  <div class="modal-sheet">
    <div class="modal-title">
      <span>&#9999; แก้ไขข้อมูลพนักงาน</span>
      <button onclick="closeEditEmp()" style="background:none;font-size:22px;padding:0;color:var(--gray3)">&#215;</button>
    </div>
    <div id="editEmpForm"></div>
    <div id="editEmpMsg" class="msg-box"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeEditEmp()">ยกเลิก</button>
      <button class="btn btn-primary" onclick="saveEditEmp()">&#128190; บันทึก</button>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────────
// CONFIG
// ─────────────────────────────────────────────────────────────
var API_URL     = 'https://script.google.com/macros/s/AKfycbzSqWzDIHI9NBT2uqjfnQY2dVcadmIIXns4ztfpDSSRRF3Yk1-kpxVOf9nlpruWPJoyQw/exec';
var MANAGER_KEY = 'grp-hrm-2026';

// ─────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────
var _months    = [];
var _nowMonth  = '';
var _employees = [];
var _deptFilter = 'all';
var _payMonth  = '';
var _payData   = [];
var _paySubTab = 'payroll'; // 'payroll' | 'ytd'
var _currentSlipIdx = null;
var _leaveQuotaData = [];
var _leaveQuotaYear = String(new Date().getFullYear());
var _lqDeptFilter = 'all';
var _editQuotaTarget = null; // {empId, idx}

// ─────────────────────────────────────────────────────────────
// UTILS
// ─────────────────────────────────────────────────────────────
function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function fmt(n) {
  return (parseFloat(n)||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtDate(d) {
  var s = String(d||'').substring(0,10);
  var p = s.split('-');
  if (p.length===3) return p[2]+'/'+p[1]+'/'+(parseInt(p[0])+543);
  return s;
}
function _nowMonthStr() {
  var d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function _monthLabel(m) {
  if (!m) return '';
  var p = m.split('-');
  var N = ['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  return N[parseInt(p[1])]+' '+(parseInt(p[0])+543);
}
function _depts() {
  var s={};_employees.forEach(function(e){if(e.dept)s[e.dept]=1;});return Object.keys(s).sort();
}
function _buildDeptSelect(id,val) {
  var h='<select id="'+id+'"><option value="all">ทุกแผนก</option>';
  _depts().forEach(function(d){h+='<option value="'+esc(d)+'"'+(d===val?' selected':'')+'>'+esc(d)+'</option>';});
  return h+'</select>';
}
// Thai progressive tax helper
function _calcMonthlyTax(monthlyIncome) {
  var annual = monthlyIncome * 12;
  var deduct = Math.min(annual * 0.5, 100000) + 60000;
  var taxable = Math.max(0, annual - deduct);
  var brackets = [[150000,0],[300000,.05],[500000,.10],[750000,.15],[1000000,.20],[2000000,.25],[5000000,.30],[Infinity,.35]];
  var tax=0, prev=0;
  for(var i=0;i<brackets.length;i++){
    var lim=brackets[i][0],rate=brackets[i][1];
    if(taxable<=prev) break;
    tax += (Math.min(taxable,lim)-prev)*rate;
    prev=lim;
  }
  return Math.round(tax/12);
}
async function apiGet(action, params) {
  var url = API_URL+'?action='+encodeURIComponent(action)+'&empId=MANAGER&credential='+encodeURIComponent(MANAGER_KEY);
  Object.keys(params||{}).forEach(function(k){url+='&'+encodeURIComponent(k)+'='+encodeURIComponent(params[k]||'');});
  var r=await fetch(url), t=await r.text();
  try{return JSON.parse(t);}catch(e){return{success:false,error:'Response error: '+t.substring(0,80)};}
}
async function apiPost(payload) {
  payload.empId='MANAGER'; payload.credential=MANAGER_KEY;
  var r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
  var t=await r.text();
  try{return JSON.parse(t);}catch(e){return{success:false,error:'Response error'};}
}

// ─────────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async function() {
  await _loadMonths();
  await _loadEmployees();
  loadDashboard();
});
$('bottomNav').addEventListener('click', function(e) {
  var btn=e.target.closest('button[data-tab]'); if(!btn) return;
  var tab=btn.dataset.tab;
  document.querySelectorAll('.bottom-nav button').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  document.querySelectorAll('.tab-content').forEach(function(t){t.style.display='none';});
  $(tab).style.display='';
  if(tab==='tabDashboard')  loadDashboard();
  if(tab==='tabEmployees')  loadEmployees();
  if(tab==='tabPayroll')    loadPayrollMgr();
  if(tab==='tabLeaveQuota') loadLeaveQuota();
});
async function _loadMonths() {
  var r=await apiGet('getMonths',{});
  if(r.success){
    _months=r.data; _payMonth=_months[0]||_nowMonthStr();
    _nowMonth=_nowMonthStr();
    if(_months.indexOf(_nowMonth)<0) _months.unshift(_nowMonth);
  }
}
async function _loadEmployees() {
  var r=await apiGet('getEmployeeList',{});
  if(r.success) _employees=r.data;
}

// ─────────────────────────────────────────────────────────────
// TAB: DASHBOARD
// ─────────────────────────────────────────────────────────────
async function loadDashboard() {
  $('tabDashboard').innerHTML='<div class="loading">&#9203; กำลังโหลด...</div>';
  var payR=await apiGet('getPayrollSummary',{month:_nowMonth});
  var payRows=payR.success?payR.data:[];
  var confirmed=payRows.filter(function(r){return r.status==='confirmed';});
  var totalNet=confirmed.reduce(function(s,r){return s+(parseFloat(r.netPay)||0);},0);
  var active=_employees.filter(function(e){return e.status!=='ลาออก'&&e.status!=='พ้นสภาพ';});
  var probation=active.filter(function(e){return e.status==='พนักงานทดลองงาน';});

  var html='<div class="card"><div class="card-header"><h2>&#128202; Dashboard</h2><p>'+_monthLabel(_nowMonth)+'</p></div>';
  html+='<div class="card-body"><div class="stat-grid">';
  html+='<div class="stat-card c-blue"><div class="stat-num">'+active.length+'</div><div class="stat-label">พนักงานปัจจุบัน</div></div>';
  html+='<div class="stat-card c-yellow"><div class="stat-num">'+probation.length+'</div><div class="stat-label">ทดลองงาน</div></div>';
  html+='<div class="stat-card c-green"><div class="stat-num">'+confirmed.length+'</div><div class="stat-label">Confirmed เดือนนี้</div></div>';
  html+='<div class="stat-card c-red"><div class="stat-num">'+_depts().length+'</div><div class="stat-label">แผนก</div></div>';
  html+='</div>';
  if(totalNet>0){
    html+='<div style="background:var(--blue-light);border-radius:10px;padding:14px;text-align:center;border:1px solid var(--blue)">';
    html+='<div style="font-size:12px;color:var(--gray3);margin-bottom:4px">ยอดเงินเดือนสุทธิรวมเดือนนี้</div>';
    html+='<div style="font-size:24px;font-weight:700;color:var(--navy)">&#3647;'+fmt(totalNet)+'</div></div>';
  }
  html+='</div></div>';

  // Probation alert — milestones 30/60/90/120 days
  var today=new Date(); today.setHours(0,0,0,0);
  var probAlerts=[];
  probation.forEach(function(e){
    if(!e.startDate) return;
    var start=new Date(String(e.startDate).substring(0,10));
    if(isNaN(start.getTime())) return;
    var days=Math.floor((today-start)/(1000*60*60*24));
    if(days<0||days>150) return; // ignore very new (<today) or way past
    var milestones=[30,60,90,120];
    milestones.forEach(function(ms){
      var diff=days-ms; // -7..+3 window
      if(diff>=-7&&diff<=3){
        probAlerts.push({emp:e,days:days,milestone:ms,diff:diff,overdue:days>120});
      }
    });
    if(days>120&&days<=150){
      probAlerts.push({emp:e,days:days,milestone:120,diff:days-120,overdue:true});
    }
  });
  // De-duplicate (closest milestone per employee)
  var seen={};
  probAlerts=probAlerts.filter(function(a){
    var k=a.emp.empId; if(seen[k]) return false; seen[k]=1; return true;
  });

  if(probAlerts.length>0){
    html+='<div class="card"><div class="card-header" style="background:linear-gradient(135deg,var(--purple),#4a0080)">';
    html+='<h2>&#9888; แจ้งเตือนทดลองงาน ('+probAlerts.length+' คน)</h2>';
    html+='<p>พนักงานที่ใกล้ถึง Milestone 30/60/90/120 วัน (±7 วัน)</p></div>';
    html+='<div class="card-body">';
    probAlerts.forEach(function(a){
      var pct=Math.min(100,Math.round((a.days/120)*100));
      var colorClass=a.overdue?'overdue':'';
      var msLabel=a.milestone===120?'ครบทดลองงาน':a.milestone+' วัน';
      var diffLabel=a.diff===0?'วันนี้':(a.diff>0?'เลย '+a.diff+' วัน':'อีก '+Math.abs(a.diff)+' วัน');
      html+='<div class="emp-row">';
      html+='<div class="emp-avatar" style="background:var(--purple-light);color:var(--purple)">'+esc((a.emp.name||'?').replace(/^(นาย|นาง|นางสาว)/,'').trim().charAt(0))+'</div>';
      html+='<div class="emp-info">';
      html+='<div class="emp-name">'+esc(a.emp.name)+'</div>';
      html+='<div class="emp-meta">'+esc(a.emp.empId)+' · '+esc(a.emp.dept||'')+'</div>';
      html+='<div class="emp-meta">วันเริ่ม '+fmtDate(a.emp.startDate)+' · ผ่านมา '+a.days+' วัน</div>';
      html+='<div class="prob-bar-wrap"><div class="prob-bar '+colorClass+'" style="width:'+pct+'%"></div></div>';
      html+='</div>';
      html+='<div style="text-align:right;flex-shrink:0">';
      html+='<span class="badge '+(a.overdue?'badge-overdue':'badge-probation')+'">'+msLabel+'</span>';
      html+='<div style="font-size:11px;margin-top:3px;color:'+(a.overdue?'var(--red)':'var(--purple)')+'">'+diffLabel+'</div>';
      html+='</div></div>';
    });
    html+='</div></div>';
  }

  // Dept breakdown with salary
  html+='<div class="card"><div class="card-header"><h2>&#128101; พนักงานแยกแผนก</h2></div><div class="card-body">';
  var dc={},ds={};
  active.forEach(function(e){var d=e.dept||'ไม่ระบุ';dc[d]=(dc[d]||0)+1;ds[d]=(ds[d]||0)+(parseFloat(e.salary)||0);});
  Object.keys(dc).sort().forEach(function(d){
    html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--gray2);font-size:13px">';
    html+='<span>'+esc(d)+'</span>';
    html+='<span><span style="font-weight:600;color:var(--blue)">'+dc[d]+' คน</span> <span style="color:var(--gray3);font-size:11px">&#3647;'+fmt(ds[d])+'</span></span>';
    html+='</div>';
  });
  html+='</div></div>';
  $('tabDashboard').innerHTML=html;
}

function filterEmployees() {
  var s=($('empSearch')?$('empSearch').value:'').toLowerCase();

  var f=_employees.filter(function(e){
    return (!s||e.name.toLowerCase().indexOf(s)>=0||(e.nickname||'').toLowerCase().indexOf(s)>=0)
        &&(dept==='all'||e.dept===dept);
  });
  if($('empList')) $('empList').innerHTML=_renderEmpList(f);

function _renderEmpList(list) {
  if(!list.length) return '<div class="empty"><div class="empty-icon">&#128269;</div>ไม่พบพนักงาน</div>';
  var sColors={'พนักงานประจำ':'var(--green)','พนักงานทดลองงาน':'var(--purple)','ลาออก':'var(--red)','พ้นสภาพ':'var(--gray3)'};
  return list.map(function(e){
    var init=(e.name||'').replace(/^(นาย|นาง|นางสาว)/,'').trim().charAt(0);
    var col=sColors[e.status]||'var(--blue)';
    var today=new Date(); today.setHours(0,0,0,0);
    var probHtml='';
    if(e.status==='พนักงานทดลองงาน'&&e.startDate){
      var start=new Date(String(e.startDate).substring(0,10));
      if(!isNaN(start.getTime())){
        var days=Math.floor((today-start)/(1000*60*60*24));
        var pct=Math.min(100,Math.round((days/120)*100));
        var nextMs=days<30?30:days<60?60:days<90?90:120;
        var daysLeft=nextMs-days;
        probHtml='<div class="emp-meta" style="margin-top:2px">ทดลองงาน '+days+' วัน · '+(daysLeft>0?'อีก '+daysLeft+' วันถึง '+nextMs+'วัน':'ถึง '+nextMs+'วันแล้ว')+'</div>';
        probHtml+='<div class="prob-bar-wrap"><div class="prob-bar'+(days>120?' overdue':'')+'" style="width:'+pct+'%"></div></div>';
      }
    }
    return '<div class="emp-row">'+
      '<div class="emp-avatar">'+esc(init)+'</div>'+
      '<div class="emp-info">'+
        '<div class="emp-name">'+esc(e.name)+(e.nickname?' <span style="color:var(--gray3);font-weight:400;font-size:12px">('+esc(e.nickname)+')</span>':'')+' </div>'+
        '<div class="emp-meta">'+esc(e.empId)+' · '+esc(e.dept||'ไม่ระบุ')+' · '+esc(e.position||'')+'</div>'+
        '<div class="emp-meta">&#3647;'+fmt(e.salary)+(e.email?' · &#128231; '+esc(e.email):' · <span style="color:var(--red)">ไม่มีอีเมล</span>')+'</div>'+
        probHtml+
      '</div>'+
      '<div class="emp-status" style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">'+
        '<span style="font-size:11px;color:'+col+';font-weight:600">'+esc(e.status||'')+'</span>'+
        '<button class="btn btn-secondary btn-sm" onclick="openEditEmp(\''+esc(e.empId)+'\')">&#9999; แก้ไข</button>'+
      '</div>'+
    '</div>';
  }).join('');
}

async function loadPayrollMgr() {
  $('tabPayroll').innerHTML='<div class="loading">&#9203; กำลังโหลด...</div>';
  if(_paySubTab==='ytd'){ _renderYTDView(); return; }

  var existR=await apiGet('getPayrollSummary',{month:_payMonth});
  var existing={};
  if(existR.success) existR.data.forEach(function(r){existing[r.empId]=r;});

  var active=_employees.filter(function(e){return e.status!=='ลาออก'&&e.status!=='พ้นสภาพ';});
  _payData=active.map(function(e){
    var ex=existing[e.empId]||{};
    var baseAllowances=(parseFloat(e.phoneAllow)||0)+(parseFloat(e.skillAllow)||0)+(parseFloat(e.proAllow)||0)+(parseFloat(e.travelAllow)||0);
    var allowances=ex.allowances!==undefined?ex.allowances:baseAllowances;
    var ti=(parseFloat(ex.salary!==undefined?ex.salary:e.salary)||0)+(parseFloat(allowances)||0)+
           (parseFloat(ex.otPay)||0)+(parseFloat(ex.otherIncome)||0)+
           (parseFloat(ex.birthdayAllow)||0)+(parseFloat(ex.weddingAllow)||0)+(parseFloat(ex.specialAcctAllow)||0);
    return {
      empId:e.empId, name:e.name, dept:e.dept, position:e.position, month:_payMonth,
      salary:      ex.salary!==undefined ? ex.salary : e.salary,
      allowances:  allowances,
      otPay:       ex.otPay||0,
      otherIncome: ex.otherIncome||0,
      birthdayAllow:    ex.birthdayAllow||0,
      weddingAllow:     ex.weddingAllow||0,
      specialAcctAllow: ex.specialAcctAllow||0,
      otherDeduct: ex.otherDeduct||0,
      withholdingTax: ex.withholdingTax!==undefined ? ex.withholdingTax : _calcMonthlyTax(ti),
      note:        ex.note||'',
      status:      ex.status||'draft'
    };
  });
  _renderPayrollMgr();
}

function _switchPayTab(tab){
  _paySubTab=tab;
  if(tab==='ytd') _renderYTDView(); else loadPayrollMgr();
}
function _onPayYearMonthChange(){
  var y=$('payYear')?$('payYear').value:'';
  var m=$('payMonthNum')?$('payMonthNum').value:'';
  if(y&&m){_payMonth=y+'-'+m;loadPayrollMgr();}
}
function updatePayRow(input){
  var idx=parseInt(input.dataset.idx), field=input.dataset.field;
  _payData[idx][field]=Number(input.value)||0;
  var r=_payData[idx];
  var ti=(r.salary||0)+(r.allowances||0)+(r.otPay||0)+(r.otherIncome||0)+(r.birthdayAllow||0)+(r.weddingAllow||0)+(r.specialAcctAllow||0);
  var sso=Math.min(Math.round(ti*0.05),750);
  // Auto-recalc tax only if the user is not editing the tax field directly
  if(field!=='withholdingTax') _payData[idx].withholdingTax=_calcMonthlyTax(ti);
  var net=ti-sso-(_payData[idx].withholdingTax||0)-(r.otherDeduct||0);
  if($('net_'+idx)) $('net_'+idx).textContent='฿'+fmt(net);
  if($('sso_'+idx)) $('sso_'+idx).textContent='฿'+fmt(sso);
  // Refresh tax input if it was auto-recalculated
  if(field!=='withholdingTax'){
    var taxInput=document.querySelector('input[data-idx="'+idx+'"][data-field="withholdingTax"]');
    if(taxInput) taxInput.value=_payData[idx].withholdingTax;
  }
}
async function savePayroll(status){
  var msg=$('payMgrMsg');
  msg.className='msg-box'; msg.textContent='กำลังบันทึก...'; msg.style.display='block';
  var rows=_payData.map(function(r){return Object.assign({},r,{month:_payMonth});});
  var res=await apiPost({action:'savePayroll',rows:rows,status:status});
  if(res.success){
    _payData.forEach(function(r){r.status=status;}); // ★ update locally — no API re-fetch
    _renderPayrollMgr();
    var msg2=$('payMgrMsg');
    if(msg2){
      msg2.className='msg-box msg-success';
      msg2.textContent=(status==='confirmed'?'✓ Confirm':'💾 Save')+' เงินเดือน '+_monthLabel(_payMonth)+' เรียบร้อย ('+res.saved+' คน)';
      msg2.style.display='block';
      setTimeout(function(){if($('payMgrMsg'))$('payMgrMsg').style.display='none';},4000);
    }
    return;
  } else {
    msg.className='msg-box msg-error'; msg.textContent='&#10060; '+esc(res.error);
  }
  setTimeout(function(){if($('payMgrMsg'))$('payMgrMsg').style.display='none';},4000);
}

function exportPayrollCSV(){
  var headers=['EmpID','ชื่อ','แผนก','ตำแหน่ง','เดือน','เงินเดือน','เบี้ยเลี้ยง','OT','รายรับอื่น','วันเกิด','มงคลสมรส','พิเศษบัญชี','รวมรายรับ','SSO','ภาษีหัก','หักอื่น','รวมรายหัก','เงินสุทธิ','สถานะ','หมายเหตุ'];
  var rows=[headers.join(',')];
  _payData.forEach(function(r){
    var ti=(r.salary||0)+(r.allowances||0)+(r.otPay||0)+(r.otherIncome||0)+(r.birthdayAllow||0)+(r.weddingAllow||0)+(r.specialAcctAllow||0);
    var sso=Math.min(Math.round(ti*0.05),750);
    var tax=r.withholdingTax||0;
    var totalDeduct=sso+tax+(r.otherDeduct||0);
    var net=ti-totalDeduct;
    var cells=[
      r.empId, '"'+r.name+'"', '"'+(r.dept||'')+'"', '"'+(r.position||'')+'"', r.month,
      r.salary||0, r.allowances||0, r.otPay||0, r.otherIncome||0,
      r.birthdayAllow||0, r.weddingAllow||0, r.specialAcctAllow||0,
      ti, sso, tax, r.otherDeduct||0, totalDeduct, net,
      r.status, '"'+(r.note||'')+'"'
    ];
    rows.push(cells.join(','));
  });
  var csv='\uFEFF'+rows.join('\n'); // BOM for Excel Thai
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url; a.download='payroll_'+_payMonth+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},10000);
}

function exportYTDCSV(data,year){
  var h=['EmpID','ชื่อ','แผนก','ตำแหน่ง','เดือนที่ Confirmed','รวมรายรับ','SSO สะสม','ภาษีสะสม','รวมรายหัก','สุทธิสะสม'];
  var rows=[h.join(',')];
  data.forEach(function(d){
    rows.push([d.empId,'"'+d.name+'"','"'+(d.dept||'')+'"','"'+(d.position||'')+'"',d.months,
      d.totalIncome,d.totalSSO,d.totalWithholdingTax,d.totalDeduct,d.totalNet].join(','));
  });
  var csv='\uFEFF'+rows.join('\n');
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a'); a.href=url; a.download='ytd_'+year+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},10000);
}

async function sendAllSlips(){
  var toSend=_payData.filter(function(r){return r.status==='confirmed';});
  if(!toSend.length){alert('ไม่มีพนักงานที่ Confirmed เดือนนี้ กรุณา Confirm ก่อน');return;}
  var withEmail=toSend.filter(function(r){
    var e=_employees.find(function(x){return x.empId===r.empId;});
    return e&&e.email;
  });
  if(!window.confirm('ส่งสลิปเงินเดือน '+_monthLabel(_payMonth)+'\nส่ง: '+withEmail.length+' คน · ข้าม (ไม่มีอีเมล): '+(toSend.length-withEmail.length)+' คน\n\nยืนยัน?')) return;

  var pw=$('sendProgress'),pb=$('sendProgressBar'),pl=$('sendProgressLabel');
  pw.style.display='block'; var msg=$('payMgrMsg'); msg.style.display='none';
  var sent=0,skipped=0,failed=0,total=toSend.length;

  for(var i=0;i<toSend.length;i++){
    var row=toSend[i];
    pl.textContent='กำลังส่ง '+esc(row.name)+' ('+(i+1)+'/'+total+')...';
    pb.style.width=Math.round(((i+1)/total)*100)+'%';
    var res=await apiPost({action:'sendPayrollEmail',targetEmpId:row.empId,month:_payMonth});
    if(res.success) sent++;
    else if(res.skipped) skipped++;
    else failed++;
  }
  pw.style.display='none';
  msg.className='msg-box '+(failed>0?'msg-error':'msg-success');
  msg.style.display='block';
  msg.textContent='&#128231; ส่งสำเร็จ '+sent+' คน · ข้าม '+skipped+' คน'+(failed>0?' · ผิดพลาด '+failed+' คน':'');
  setTimeout(function(){if($('payMgrMsg'))$('payMgrMsg').style.display='none';},6000);
}

function _buildYearMonthSelects(payMonth){
  var years={};_months.forEach(function(m){years[m.split('-')[0]]=1;});
  var cy=new Date().getFullYear(); years[cy]=1; years[cy-1]=1;
  var yl=Object.keys(years).sort().reverse();
  var curY=payMonth?payMonth.split('-')[0]:String(cy);
  var curM=payMonth?payMonth.split('-')[1]:String(new Date().getMonth()+1).padStart(2,'0');
  var TM=['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

  h+='<span style="font-size:13px;font-weight:600;color:var(--navy)">เดือน:</span>';
  h+='<select id="payMonthNum" style="width:90px">';
  for(var m=1;m<=12;m++){var mv=String(m).padStart(2,'0');h+='<option value="'+mv+'"'+(mv===curM?' selected':'')+'>'+TM[m]+'</option>';}
  h+='</select><span style="font-size:13px;font-weight:600;color:var(--navy)">ปี:</span>';
  h+='<select id="payYear" style="width:82px">';
  yl.forEach(function(y){h+='<option value="'+y+'"'+(y===curY?' selected':'')+'>'+(parseInt(y)+543)+'</option>';});
  return h+'</select></div>';
}

  if(!name){msg.className='msg-box msg-error';msg.textContent='&#10060; กรุณากรอกชื่อ-นามสกุล';msg.style.display='block';return;}
  msg.className='msg-box';msg.textContent='กำลังบันทึก...';msg.style.display='block';
  var data={
    name:name,
    nickname:    $('ef_nickname')   ?$('ef_nickname').value.trim():'',
    dept:        $('ef_dept')       ?$('ef_dept').value.trim():'',
    position:    $('ef_position')   ?$('ef_position').value.trim():'',
    status:      $('ef_status')     ?$('ef_status').value:'',
    empType:     $('ef_empType')    ?$('ef_empType').value:'',
    phone:       $('ef_phone')      ?$('ef_phone').value.trim():'',
    startDate:   $('ef_startDate')  ?$('ef_startDate').value:'',
    salary:      $('ef_salary')     ?Number($('ef_salary').value)||0:0,
    phoneAllow:  $('ef_phoneAllow') ?Number($('ef_phoneAllow').value)||0:0,
    skillAllow:  $('ef_skillAllow') ?Number($('ef_skillAllow').value)||0:0,
    proAllow:    $('ef_proAllow')   ?Number($('ef_proAllow').value)||0:0,
    travelAllow: $('ef_travelAllow')?Number($('ef_travelAllow').value)||0:0,
    bank:        $('ef_bank')       ?$('ef_bank').value:'',
    bankAcct:    $('ef_bankAcct')   ?$('ef_bankAcct').value.trim():'',
    bankName:    $('ef_bankName')   ?$('ef_bankName').value.trim():'',
    email:       $('ef_email')      ?$('ef_email').value.trim():''
  };
  var r=await apiPost({action:'updateEmployee',targetEmpId:_editEmpData.empId,data:data});
  if(r.success){
    msg.className='msg-box msg-success';msg.textContent='&#10003; บันทึกข้อมูลเรียบร้อย';
    await _loadEmployees();
    setTimeout(function(){closeEditEmp();loadEmployees();},1200);
  } else {
    msg.className='msg-box msg-error';msg.textContent='\u274c '+esc(r.error);
  }
}

// ─────────────────────────────────────────────────────────────
// LEAVE QUOTA — สิทธิ์วันลา
// ─────────────────────────────────────────────────────────────
async function loadLeaveQuota() {
  $('tabLeaveQuota').innerHTML='<div class="loading">\u23f3 กำลังโหลดสิทธิ์วันลา...</div>';
  var r=await apiGet('getAllLeaveQuota',{year:_leaveQuotaYear,dept:_lqDeptFilter});
  if(!r.success){$('tabLeaveQuota').innerHTML='<div class="empty"><div class="empty-icon">\u274c</div>'+esc(r.error)+'</div>';return;}
  _leaveQuotaData=r.data||[];
  _renderLeaveQuota();
}

function _lqBar(used,quota) {
  if(!quota) return '<span style="font-size:11px;color:var(--gray3)">N/A</span>';
  var pct=Math.min(100,Math.round((used/quota)*100));
  var rem=Math.max(0,quota-used);
  var clr=rem<=0?'var(--red)':pct>=70?'var(--yellow)':'var(--green)';
  var txt=rem<=0?'<span style="color:var(--red);font-weight:700">หมด</span>':'<span style="color:var(--green)">เหลือ '+rem+'</span>';
  return '<div style="font-size:11px">'+used+'/'+quota+' '+txt+'</div>'
    +'<div style="height:4px;background:var(--gray2);border-radius:2px;margin-top:2px">'
    +'<div style="height:100%;width:'+pct+'%;background:'+clr+';border-radius:2px"></div></div>';
}

function _renderLeaveQuota() {
  var yearOpts='';
  for(var y=2024;y<=2027;y++) yearOpts+='<option value="'+y+'"'+(String(y)===_leaveQuotaYear?' selected':'')+'>'+y+'</option>';

  var html='<div class="card"><div class="card-header"><h2>\ud83d\udccb การจัดการสิทธิ์การลา</h2><p>จัดการสิทธิ์วันลาพนักงาน</p></div><div class="card-body">';
  html+='<div class="filter-bar" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">';
  html+='<select onchange="_leaveQuotaYear=this.value;loadLeaveQuota()">'+yearOpts+'</select>';
  html+=_buildDeptSelect('lqDeptSel',_lqDeptFilter);
  html+='<button class="btn btn-secondary btn-sm" onclick="initNewYear()" style="white-space:nowrap">\ud83d\udcc4 Initialize ปี '+_leaveQuotaYear+'</button>';
  html+='</div></div></div>';

  if(_leaveQuotaData.length===0){
    html+='<div class="empty"><div class="empty-icon">\ud83d\udccb</div>ยังไม่มีข้อมูลสิทธิ์วันลา<br><small>กด "Initialize" เพื่อสร้างข้อมูลเริ่มต้น</small></div>';
    $('tabLeaveQuota').innerHTML=html;
    $('lqDeptSel').addEventListener('change',function(){_lqDeptFilter=this.value;loadLeaveQuota();});
    return;
  }

  html+='<div class="card"><div class="card-body"><div style="overflow-x:auto">';
  html+='<table class="pay-mgr-table" style="min-width:800px"><thead><tr>';
  html+='<th style="text-align:left">รหัส</th><th style="text-align:left">ชื่อ</th><th style="text-align:left">แผนก</th>';
  html+='<th>ลาป่วย</th><th>ลากิจ</th><th>ลากิจพิเศษ</th><th>พักร้อน</th><th>ลาคลอด<br>(รับเงิน)</th><th></th></tr></thead><tbody>';

  _leaveQuotaData.forEach(function(r,i){
    html+='<tr>';
    html+='<td style="text-align:left;font-size:11px;color:var(--gray3)">'+esc(r.empId)+'</td>';
    html+='<td style="text-align:left"><strong>'+esc(r.name)+'</strong></td>';
    html+='<td style="text-align:left;font-size:11px">'+esc(r.dept)+'</td>';
    html+='<td>'+_lqBar(r.sick.used,r.sick.quota)+'</td>';
    html+='<td>'+_lqBar(r.personal.used,r.personal.quota)+'</td>';
    html+='<td>'+_lqBar(r.specialPersonal.used,r.specialPersonal.quota)+'</td>';
    html+='<td>'+_lqBar(r.vacation.used,r.vacation.quota)+'</td>';
    html+='<td>'+_lqBar(r.matPaid.used,r.matPaid.quota)+'</td>';
    html+='<td><button class="btn btn-secondary btn-sm" onclick="openEditQuota(\''+esc(r.empId)+'\','+i+')">แก้ไข</button></td>';
    html+='</tr>';
  });
  html+='</tbody></table></div></div></div>';
  $('tabLeaveQuota').innerHTML=html;
  $('lqDeptSel').addEventListener('change',function(){_lqDeptFilter=this.value;loadLeaveQuota();});
}

function openEditQuota(empId, idx) {
  _editQuotaTarget={empId:empId,idx:idx};
  var row=_leaveQuotaData[idx];
  function qRow(label,key,usedVal,quotaVal){
    var rem=Math.max(0,(Number(quotaVal)||0)-(Number(usedVal)||0));
    var remColor=rem>0?'var(--green)':'var(--red)';
    return '<div style="margin-bottom:14px;padding:10px;background:var(--gray1);border-radius:8px;border:1px solid var(--gray2)">'
      +'<div style="font-size:12px;font-weight:700;margin-bottom:8px;color:var(--navy)">'+label+'</div>'
      +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'
      +'<div><div style="font-size:10px;color:var(--gray3);margin-bottom:3px">สิทธิ์การลาทั้งหมด</div>'
      +'<input type="number" min="0" max="365" id="lq_q_'+key+'" value="'+quotaVal+'" oninput="updateLqRemaining(\''+key+'\')" style="text-align:center"></div>'
      +'<div><div style="font-size:10px;color:var(--gray3);margin-bottom:3px">วันลาที่ใช้ไปแล้ว</div>'
      +'<input type="number" min="0" max="365" id="lq_u_'+key+'" value="'+usedVal+'" oninput="updateLqRemaining(\''+key+'\')" style="text-align:center"></div>'
      +'</div>'
      +'<div id="lq_rem_'+key+'" style="font-size:11px;font-weight:600;margin-top:6px;color:'+remColor+'">เหลือ: '+rem+' วัน/ครั้ง</div>'
      +'</div>';
  }
  var form='<div style="font-size:13px;font-weight:700;margin-bottom:12px;color:var(--navy)">'+esc(row.name)+' — ปี '+_leaveQuotaYear+'</div>';
  form+=qRow('ลาป่วย (วัน)','sick',row.sick.used,row.sick.quota);
  form+=qRow('ลากิจ (วัน)','personal',row.personal.used,row.personal.quota);
  form+=qRow('ลากิจพิเศษ (วัน)','special',row.specialPersonal.used,row.specialPersonal.quota);
  form+=qRow('พักร้อน (วัน)','vacation',row.vacation.used,row.vacation.quota);
  form+=qRow('ลาคลอดรับเงิน (วัน)','matPaid',row.matPaid.used,row.matPaid.quota);
  form+=qRow('ลาคลอดไม่รับเงิน (วัน)','matUnpaid',row.matUnpaid.used,row.matUnpaid.quota);
  form+=qRow('ลาฝากครรภ์ (ครั้ง)','prenatal',row.prenatal.used,row.prenatal.quota);
  form+=qRow('ลาราชการทหาร (วัน)','military',row.military.used,row.military.quota);
  form+='<div style="margin-bottom:10px"><label style="font-size:12px;font-weight:600;display:block;margin-bottom:3px">หมายเหตุ</label>'
    +'<input type="text" id="lq_note" value="'+esc(row.note||'')+'" placeholder="ระบุเหตุผล..."></div>';
  $('editQuotaForm').innerHTML=form;
  $('editQuotaMsg').textContent='';
  $('editQuotaMsg').className='msg-box';
  $('editQuotaModal').classList.add('open');
}
function closeEditQuota(){$('editQuotaModal').classList.remove('open');}
function updateLqRemaining(key){
  var q=Number($('lq_q_'+key).value)||0;
  var u=Number($('lq_u_'+key).value)||0;
  var rem=Math.max(0,q-u);
  var el=$('lq_rem_'+key);
  if(el){el.textContent='เหลือ: '+rem+' วัน/ครั้ง';el.style.color=rem>0?'var(--green)':'var(--red)';}
}

async function saveEditQuota() {
  var t=_editQuotaTarget; if(!t) return;
  var q=function(k){var el=$('lq_q_'+k);return el?el.value:undefined;};
  var u=function(k){var el=$('lq_u_'+k);return el?el.value:undefined;};
  var body={action:'setLeaveQuota',targetEmpId:t.empId,year:_leaveQuotaYear,
    sickQuota:q('sick'),sickUsed:u('sick'),
    personalQuota:q('personal'),personalUsed:u('personal'),
    specialQuota:q('special'),specialUsed:u('special'),
    vacationQuota:q('vacation'),vacationUsed:u('vacation'),
    matPaidQuota:q('matPaid'),matPaidUsed:u('matPaid'),
    matUnpaidQuota:q('matUnpaid'),matUnpaidUsed:u('matUnpaid'),
    prenatalQuota:q('prenatal'),prenatalUsed:u('prenatal'),
    militaryQuota:q('military'),militaryUsed:u('military'),
    note:$('lq_note').value};
  var msg=$('editQuotaMsg');
  msg.className='msg-box';msg.textContent='กำลังบันทึก...';
  var r=await apiPost(body);
  if(r.success){
    var row=_leaveQuotaData[t.idx];
    function upd(grp,qKey,uKey){
      if(body[qKey]!==undefined) row[grp].quota=Number(body[qKey])||0;
      if(body[uKey]!==undefined) row[grp].used=Number(body[uKey])||0;
      row[grp].remaining=Math.max(0,row[grp].quota-row[grp].used);
    }
    upd('sick','sickQuota','sickUsed'); upd('personal','personalQuota','personalUsed');
    upd('specialPersonal','specialQuota','specialUsed'); upd('vacation','vacationQuota','vacationUsed');
    upd('matPaid','matPaidQuota','matPaidUsed'); upd('matUnpaid','matUnpaidQuota','matUnpaidUsed');
    upd('prenatal','prenatalQuota','prenatalUsed'); upd('military','militaryQuota','militaryUsed');
    row.note=$('lq_note').value;
    closeEditQuota();
    _renderLeaveQuota();
  } else {
    msg.className='msg-box msg-error';msg.textContent='\u274c '+esc(r.error);
  }
}

async function initNewYear() {
  if(!confirm('สร้างสิทธิ์วันลาปี '+_leaveQuotaYear+' ให้พนักงานทุกคนที่ยังไม่มี?\n(ข้อมูลที่มีอยู่แล้วจะไม่ถูกเปลี่ยน)')) return;
  var r=await apiPost({action:'initLeaveQuota',year:_leaveQuotaYear,overwrite:false});
  if(r.success){
    alert('\u2705 สร้างแล้ว '+r.initialized+' คน | ข้ามที่มีอยู่แล้ว '+r.skipped+' คน');
    loadLeaveQuota();
  } else {
    alert('\u274c '+r.error);
  }
}
</script>
